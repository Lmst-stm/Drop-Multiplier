plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

neoForge {
    version = "26.1.2.126"
    mods {
        dropmultiplier {
            sourceSet sourceSets.main
        }
    }
    runs {
        server {
            server()
            programArguments.addAll '--nogui'
        }
        client {
            client()
        }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

version = '1.0.1'
group = 'lmstmyh.dropmultiplier'
base { archivesName = 'dropmultiplier' }
